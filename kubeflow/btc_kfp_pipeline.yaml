# PIPELINE DEFINITION
# Name: btc-seven-day-forecast
# Description: Daily BTC forecast training pipeline
components:
  comp-generate-features:
    executorLabel: exec-generate-features
    inputDefinitions:
      artifacts:
        input_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        output_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-ingest-data:
    executorLabel: exec-ingest-data
    outputDefinitions:
      artifacts:
        output_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        input_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-generate-features:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_features
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.3.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_features(input_data: dsl.Input[dsl.Dataset], output_data:\
          \ dsl.Output[dsl.Dataset]):\n    import pandas as pd\n\n    frame = pd.read_csv(input_data.path)\n\
          \    close = frame[\"Close\"].astype(float)\n    frame[\"ma_7\"] = close.rolling(7).mean()\n\
          \    frame[\"ma_30\"] = close.rolling(30).mean()\n    frame[\"volatility_7\"\
          ] = close.pct_change().rolling(7).std()\n    frame.dropna().to_csv(output_data.path,\
          \ index=False)\n\n"
        image: python:3.11-slim
    exec-ingest-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests==2.32.5'\
          \ 'pandas==2.3.3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.18.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_data(output_data: dsl.Output[dsl.Dataset]):\n    from\
          \ datetime import datetime, timezone\n\n    import pandas as pd\n    import\
          \ requests\n\n    response = requests.get(\n        \"https://api.binance.com/api/v3/klines\"\
          ,\n        params={\"symbol\": \"BTCUSDT\", \"interval\": \"1d\", \"limit\"\
          : 1000},\n        headers={\"User-Agent\": \"btc-forecast-kfp/1.0\"},\n\
          \        timeout=30,\n    )\n    response.raise_for_status()\n    candles\
          \ = response.json()\n    data = pd.DataFrame(\n        {\n            \"\
          Date\": [datetime.fromtimestamp(row[0] / 1000, timezone.utc).date() for\
          \ row in candles],\n            \"Open\": [float(row[1]) for row in candles],\n\
          \            \"High\": [float(row[2]) for row in candles],\n           \
          \ \"Low\": [float(row[3]) for row in candles],\n            \"Close\": [float(row[4])\
          \ for row in candles],\n            \"Volume\": [float(row[5]) for row in\
          \ candles],\n        }\n    ).dropna()\n    data.to_csv(output_data.path,\
          \ index=False)\n\n"
        image: python:3.11-slim
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.3.3'\
          \ 'scikit-learn==1.7.2' 'joblib==1.5.2'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.18.1' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    input_data: dsl.Input[dsl.Dataset], model:\
          \ dsl.Output[dsl.Model], metrics: dsl.Output[dsl.Metrics]\n):\n    import\
          \ joblib\n    import numpy as np\n    import pandas as pd\n    from sklearn.linear_model\
          \ import Ridge\n    from sklearn.metrics import mean_absolute_error\n\n\
          \    values = pd.read_csv(input_data.path)[\"Close\"].astype(float).to_numpy()\n\
          \    lags = 30\n    x = np.asarray([values[i - lags : i] for i in range(lags,\
          \ len(values))])\n    y = values[lags:]\n    split = len(x) - 7\n    fitted\
          \ = Ridge(alpha=1.0).fit(x[:split], y[:split])\n    prediction = fitted.predict(x[split:])\n\
          \    mae = float(mean_absolute_error(y[split:], prediction))\n    joblib.dump(fitted,\
          \ model.path)\n    metrics.log_metric(\"mae\", mae)\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: Daily BTC forecast training pipeline
  name: btc-seven-day-forecast
root:
  dag:
    tasks:
      generate-features:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-features
        dependentTasks:
        - ingest-data
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: ingest-data
        taskInfo:
          name: generate-features
      ingest-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-data
        taskInfo:
          name: ingest-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - generate-features
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: generate-features
        taskInfo:
          name: train-model
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.1
