apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
data:
  MODEL_STAGE: production
  LOG_LEVEL: INFO
  PORT: "5000"
  MODEL_DIR: /app/models
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
type: Opaque
stringData:
  RELOAD_TOKEN: replace-before-production
  MARKET_API_KEY: public-data-source-no-key-required

