apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast-api
  labels:
    app: btc-forecast-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: btc-forecast-api
  template:
    metadata:
      labels:
        app: btc-forecast-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: seed-model
          image: btc-forecast-api:local
          imagePullPolicy: Never
          command: ["sh", "-c", "cp -n /seed-models/* /app/models/ 2>/dev/null || true"]
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
      containers:
        - name: api
          image: btc-forecast-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: btc-forecast-config
            - secretRef:
                name: btc-forecast-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: btc-model-pvc

